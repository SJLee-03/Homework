name: Build and Push to Docker Hub

# 워크플로는 main 브랜치에 코드가 push 되거나 Pull Request가 열릴 때 동작합니다.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 레포지토리의 소스 코드를 체크아웃 합니다.
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Docker 빌드 캐시 및 최신 빌드 기능(Multi-arch 등) 지원을 위해 Buildx 셋업
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Docker Hub 로그인 (Secrets 환경변수 활용)
      - name: Log in to Docker Hub
        # PR(Pull Request)일 경우에는 Docker Hub에 배포하지 않도록 분기처리 가능합니다만
        # 여기서는 기본적으로 로그인을 실시합니다.
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. 이미지 빌드 및 푸시 (레이어 캐싱을 적용해 빌드 시간 최적화)
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # Pull Request일 경우 원격 도커 허브에 푸시하지 않고 빌드 테스트만 진행합니다.
          push: ${{ github.event_name != 'pull_request' }}
          # Docker Hub의 레포지토리에 face-to-character-api 라는 이름으로 저장합니다.
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/face-to-character-api:latest
          # 빌드 시간 단축을 위해 이전에 생성된 캐시를 활용하고, 새 캐시를 업데이트합니다.
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/face-to-character-api:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/face-to-character-api:buildcache,mode=max

  deploy:
    needs: build-and-push-image
    # main 브랜치 push 이벤트에서만 배포 (Pull Request 시에는 실행하지 않음)
    if: github.event_name != 'pull_request'
    
    # 등록된 GitHub Self-hosted Runner에서 동작하게 설정
    runs-on: self-hosted

    steps:
      # 1. Docker Hub에서 최신 빌드된 이미지를 Pull
      - name: Pull latest image from Docker Hub
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/face-to-character-api:latest

      # 2. 실행 중인 기존 컨테이너 중지 (없을 경우 에러 무시)
      - name: Stop existing container
        run: docker stop face-to-character-api || true

      # 3. 기존 컨테이너 삭제 (없을 경우 에러 무시)
      - name: Remove existing container
        run: docker rm face-to-character-api || true

      # 4. 새로운 이미지로 컨테이너 실행 (8000 포트 매핑)
      - name: Run new container
        run: docker run -d --name face-to-character-api -p 8000:8000 ${{ secrets.DOCKERHUB_USERNAME }}/face-to-character-api:latest
